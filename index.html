<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gatinhos de Roma</title>
<meta name="description" content="Roguelike de gatinhos em pixel art para revisar História: Roma e Grécia Antiga, com bimestres, provas, média final e recuperação.">
<meta name="theme-color" content="#120d1a">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Pixelify+Sans:wght@400;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header class="top">
    <h1>Gatinhos de Roma</h1>
    <div class="zone"><b id="zoneName">Colina das Cabanas</b> · <span id="anoTri">1º bimestre · Origem de Roma</span></div>
  </header>

  <section class="hud" aria-label="Status do herói">
    <div class="hero-id">
      <canvas id="heroIcon" width="16" height="16"></canvas>
      <div><b id="heroName">Biscoito</b><small id="heroLvl">Nível 1 · Guerreiro</small></div>
    </div>
    <div class="bars">
      <div class="bar hp"><span>Vida</span><div class="track"><i id="hpFill"></i></div><em id="hpTxt">20/20</em></div>
      <div class="bar xp"><span>XP</span><div class="track"><i id="xpFill"></i></div><em id="xpTxt">0/35</em></div>
      <div class="bar mn"><span>Mana</span><div class="track"><i id="mnFill"></i></div><em id="mnTxt">3/3</em></div>
    </div>
    <div class="chips">
      <span>Vidas <span class="paws" id="paws"></span></span>
      <span>Dicas <b id="hintsTxt">3</b></span>
      <span>Sequência <b id="streakTxt">0</b></span>
      <span>Desafios <b id="puzTxt">0/0</b></span>
      <span>Ataque <b id="atkTxt">4</b> · Defesa <b id="defTxt">1</b></span>
    </div>
  </section>

  <div class="stage"><canvas id="cv" width="720" height="528" aria-label="Mapa da masmorra"></canvas></div>
  <div class="log" id="log" aria-live="polite"></div>

  <section class="controls">
    <div class="dpad" aria-label="Movimento">
      <button class="u" data-dir="0,-1" aria-label="Cima">▲</button>
      <button class="l" data-dir="-1,0" aria-label="Esquerda">◀</button>
      <button class="c" id="waitBtn" aria-label="Esperar um turno">zzz</button>
      <button class="r" data-dir="1,0" aria-label="Direita">▶</button>
      <button class="d" data-dir="0,1" aria-label="Baixo">▼</button>
    </div>
    <div class="actions">
      <button class="btn gold" id="spellBtn">Bola de Lã<small>feitiço de história</small></button>
      <button class="btn" id="bolBtn">Boletim<small>notas dos bimestres</small></button>
      <button class="btn" id="helpBtn">Como jogar<small>regras da masmorra</small></button>
      <button class="btn" id="menuBtn">Menu<small>novo jogo / salvar</small></button>
    </div>
    <div class="keys">Setas ou WASD para andar · Espaço espera · M feitiço · B boletim · 1–4 responde · H dica</div>
  </section>
</div>

<div class="overlay" id="modal" hidden><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>

<script src="js/questions.js"></script>
<script src="js/game.js"></script>
</body>
</html>
